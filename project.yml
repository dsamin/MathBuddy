name: MathBuddy
options:
  bundleIdPrefix: com.devan
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  MathBuddy:
    type: application
    platform: iOS
    sources:
      - path: MathBuddy
        excludes:
          - Resources
      - path: MathBuddy/Resources/Audio
        type: folder
        buildPhase: resources
      - path: MathBuddy/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: MathBuddy/Info.plist
      properties:
        CFBundleDisplayName: MathBuddy
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSFaceIDUsageDescription: A grown-up can use device authentication to open settings.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devan.MathBuddy
        TARGETED_DEVICE_FAMILY: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false
